<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSS Total - Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background:
                radial-gradient(circle at 12% 12%, rgba(53, 208, 160, .22), transparent 30%),
                radial-gradient(circle at 88% 16%, rgba(139, 124, 246, .24), transparent 32%),
                linear-gradient(145deg, #07131f, #0d2636 58%, #282451);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .container {
            background: rgba(16, 34, 49, .94);
            color: #e8f2f8;
            border: 1px solid #284456;
            border-radius: 24px;
            padding: 38px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 28px 80px rgba(0,0,0,.38);
            backdrop-filter: blur(16px);
        }
        h1 {
            text-align: center;
            color: #f0f9ff;
            font-family: 'Fraunces', Georgia, serif;
            font-size: 1.65rem;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #92aabc;
            margin-bottom: 30px;
        }
        .brand-mark {
            display: grid;
            place-items: center;
            width: 54px;
            height: 54px;
            margin: 0 auto 16px;
            border-radius: 16px;
            background: #35d0a0;
            color: #062319;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 700;
            box-shadow: 0 12px 28px rgba(53, 208, 160, .22);
        }
        .tab-buttons {
            display: flex;
            gap: 6px;
            margin-bottom: 25px;
            padding: 5px;
            background: #0b1b28;
            border-radius: 12px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            background: transparent;
            color: #92aabc;
        }
        .tab-btn.active {
            background: #35d0a0;
            color: #062319;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #b8cbd8;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #284456;
            border-radius: 10px;
            font-size: 16px;
            background: #0b1b28;
            color: #e8f2f8;
            outline: none;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        input:focus {
            border-color: #8b7cf6;
            box-shadow: 0 0 0 3px rgba(139, 124, 246, .16);
        }
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: linear-gradient(100deg, #35d0a0, #52bfc9);
            color: #062319;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button[type="submit"]:hover {
            background: linear-gradient(100deg, #20b889, #42aab5);
            transform: translateY(-1px);
        }
        .error {
            color: #ff7d88;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .form-panel {
            display: none;
        }
        .form-panel.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand-mark">IN</div>
        <h1>INSS Total</h1>
        <div class="subtitle">Preparação inteligente, progresso constante.</div>
        
        <div class="tab-buttons">
            <button class="tab-btn active" data-tab="login">🔐 Entrar</button>
            <button class="tab-btn" data-tab="cadastro">📝 Cadastrar</button>
        </div>

        <div id="login-panel" class="form-panel active">
            <form id="loginForm">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="loginSenha" required>
                </div>
                <button type="submit">Entrar</button>
                <div id="loginError" class="error"></div>
            </form>
        </div>

        <div id="cadastro-panel" class="form-panel">
            <form id="cadastroForm">
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="cadastroNome" required>
                </div>
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="cadastroEmail" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="cadastroSenha" required>
                </div>
                <button type="submit">Cadastrar</button>
                <div id="cadastroError" class="error"></div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
                document.getElementById(`${btn.dataset.tab}-panel`).classList.add('active');
            });
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const senha = document.getElementById('loginSenha').value;
            try {
                const res = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });
                const data = await res.json();
                if (data.sucesso) {
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));
                    localStorage.setItem('inss_token', data.token);
                    window.location.href = '/dashboard.html';
                } else {
                    document.getElementById('loginError').textContent = data.erro;
                }
            } catch (error) {
                document.getElementById('loginError').textContent = 'Erro ao conectar ao servidor';
            }
        });

        document.getElementById('cadastroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('cadastroNome').value;
            const email = document.getElementById('cadastroEmail').value;
            const senha = document.getElementById('cadastroSenha').value;
            try {
                const res = await fetch(`${API_URL}/api/cadastrar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, senha })
                });
                const data = await res.json();
                if (data.sucesso) {
                    alert('Cadastro realizado! Faça login.');
                    document.querySelector('.tab-btn[data-tab="login"]').click();
                } else {
                    document.getElementById('cadastroError').textContent = data.erro;
                }
            } catch (error) {
                document.getElementById('cadastroError').textContent = 'Erro ao conectar ao servidor';
            }
        });
    </script>
</body>
</html>
